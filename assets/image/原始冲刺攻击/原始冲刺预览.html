<!doctype html><meta charset="utf-8"><title>原始冲刺攻击 · 起始序列帧</title><style>body{background:#20232a;color:#eee;font:16px sans-serif;margin:20px}canvas{width:min(95vw,1280px);background:repeating-conic-gradient(#555b66 0 25%,#3e434c 0 50%) 0/32px 32px}button,select{font-size:16px;padding:7px;margin:6px}input{width:90%}</style><h2>原始冲刺攻击 · 未手调</h2><button id="p">暂停 / 播放</button><button id="r">从头播放</button><select id="speed"><option value="24">原速</option><option value="12" selected>半速看起手</option><option value="6">四分之一速</option></select><select id="range"><option value="28">起始部分：1–28帧</option><option value="56">完整：1–56帧</option></select><label><input id="fx" type="checkbox" checked style="width:auto">显示原始特效</label><div id="info"></div><canvas id="c" width="1280" height="720"></canvas><input id="seek" type="range" min="1" max="56" value="1"><script>
const ctx=document.querySelector('#c').getContext('2d'),cache={};let i=1,run=true,t=0;const q=s=>document.querySelector(s);function image(path){if(!cache[path]){cache[path]=new Image();cache[path].src=path}return cache[path]}for(let j=1;j<=56;j++){const f='frame_'+String(j).padStart(5,'0')+'.png';image('character/'+f);image('effects/'+f)}function draw(){ctx.clearRect(0,0,1280,720);let f='frame_'+String(i).padStart(5,'0')+'.png';for(let layer of (q('#fx').checked?['character','effects']:['character'])){let im=image(layer+'/'+f);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0)}q('#info').textContent='原始帧 '+i+' / 56';q('#seek').value=i}q('#p').onclick=()=>run=!run;q('#r').onclick=()=>{i=1;run=true;t=0};q('#seek').oninput=()=>{i=+q('#seek').value;run=false;draw()};q('#range').onchange=()=>{i=1;t=0};function tick(now){if(run&&now-t>=1000/(+q('#speed').value)){i=i%(+q('#range').value)+1;t=now}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
