<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>首页 · 程序动效样片</title>
<!--
  首页程序动效样片（首页会话，11-01）。全部用代码画；方向一用游戏里的雨街分层图垫底。
  ?d=1 悬雨钟楼 / ?d=2 光弦断幕 / ?d=3 五点五十九
  键盘：1 2 3 切方向；进场后任意键开菜单；W S / 方向键选；回车 / 空格 / J 开始。
  截图参数：&at=秒（定格）&menu=秒（菜单打开时刻）&go=秒（按下开始的时刻）&sel=序号
-->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const Q=new URLSearchParams(location.search);
const D=+(Q.get('d')||1);
const FREEZE=Q.has('at');
const W=1920,H=1080,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const glowC=mk(W/2,H/2),gx=glowC.getContext('2d');
const nearC=mk(W,H),nx=nearC.getContext('2d');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,x)=>a+(b-a)*x;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x);};
const eo=x=>{x=clamp(x);return 1-(1-x)**3;};
const ei=x=>{x=clamp(x);return x*x;};
const spring=(u,k=7,w=11)=>u<=0?0:1-Math.exp(-k*u)*Math.cos(w*u);

const F_GOTH='"Old English Text MT", "UnifrakturMaguntia", serif';
const F_HEAVY='"Source Han Serif SC Heavy","Source Han Serif SC","Noto Serif SC",serif';
const F_SERIF='"Noto Serif SC","Source Han Serif SC",serif';
const VIOLET='#B792F6',VIOLET_D='#6E4BD6';

// ---------------- 状态 ----------------
const ITEMS=['开始游戏','继续','设置','退出'];
const DISABLED=[false,true,false,false];   // 还没有存档，“继续”灰着
const INTRO={1:4.8,2:5.4,3:4.6}[D];
const GO_LEN=2.8;
const S={start:performance.now()/1000,
  menuAt:Q.has('menu')?+Q.get('menu'):null,
  goAt:Q.has('go')?+Q.get('go'):null,
  sel:+(Q.get('sel')||0), selAt:-10};
const now=()=>FREEZE?+Q.get('at'):performance.now()/1000-S.start;
function nextSel(d){let s=S.sel;do{s=(s+d+ITEMS.length)%ITEMS.length;}while(DISABLED[s]);return s;}
function act(kind){
  const t=now();
  if(S.goAt!==null||t<INTRO*0.7)return;
  if(S.menuAt===null){S.menuAt=t;return;}
  if(kind==='down'){S.sel=nextSel(1);S.selAt=t;}
  else if(kind==='up'){S.sel=nextSel(-1);S.selAt=t;}
  else if(kind==='ok'&&S.sel===0)S.goAt=t;
}
addEventListener('keydown',e=>{
  if('123'.includes(e.key)&&e.key.length===1){location.search='?d='+e.key;return;}
  const k=e.key.toLowerCase();
  act(k==='arrowdown'||k==='s'?'down':k==='arrowup'||k==='w'?'up':k==='enter'||k===' '||k==='j'?'ok':'any');
});
addEventListener('mousedown',()=>act('ok'));

// ---------------- 通用材质 ----------------
const grains=[0,1,2,3].map(k=>{const c=mk(256,256),g=c.getContext('2d'),im=g.createImageData(256,256),r=rng(k*77+5);
  for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}g.putImageData(im,0,0);return c;});
function grain(t,a=0.075){ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=a;
  ctx.fillStyle=ctx.createPattern(grains[(t*24|0)%4],'repeat');ctx.fillRect(0,0,W,H);ctx.restore();}

// 横向无缝的值噪声雾
function fogCanvas(w,h,seed){
  const c=mk(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),r=rng(seed);
  const G=128,grid=new Float32Array(G*G);for(let i=0;i<G*G;i++)grid[i]=r();
  const vn=(x,y,px)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const X0=((xi%px)+px)%px,X1=(X0+1)%px,Y0=((yi%G)+G)%G,Y1=(Y0+1)%G;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return lerp(lerp(grid[Y0*G+X0],grid[Y0*G+X1],u),lerp(grid[Y1*G+X0],grid[Y1*G+X1],u),v);};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let s=0,amp=.5,cells=6;
    for(let o=0;o<5;o++){s+=amp*vn(x/w*cells,y/w*cells,cells);amp*=.5;cells*=2;}
    const i=(y*w+x)*4,v=clamp((s-.3)*2.1);
    im.data[i]=140;im.data[i+1]=160;im.data[i+2]=200;im.data[i+3]=v*v*255;}
  g.putImageData(im,0,0);return c;}
const fogC=fogCanvas(480,270,9);
function fog(t,a,y0=0,tint=null){
  ctx.save();ctx.globalCompositeOperation='screen';
  [[12,a,0],[5,a*.6,60]].forEach(([sp,al,dy])=>{ctx.globalAlpha=al;const o=(t*sp)%W;
    ctx.drawImage(fogC,-o,y0+dy,W,H);ctx.drawImage(fogC,W-o,y0+dy,W,H);});
  ctx.restore();}

function vignette(s=.85,inner=.32){const g=ctx.createRadialGradient(W/2,H/2,H*inner,W/2,H/2,H*1.0);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${s})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

// ---------------- 雨 ----------------
const WIND=0.2;
function makeRain(n,seed){const r=rng(seed),a=[];for(let i=0;i<n;i++)a.push({x:r()*(W+200),y:r()*H*1.6,z:r()**1.7,k:r()});return a;}
function drawRain(t,drops,o={}){
  const sp=o.speed??1,al=o.alpha??1,B=6;
  for(let b=0;b<B;b++){
    const z0=b/B,z1=(b+1)/B,zc=(z0+z1)/2,near=zc>0.8,g=near?nx:ctx;
    const len=lerp(14,130,zc),spd=lerp(950,2700,zc)*sp,wid=lerp(.6,2.8,zc);
    g.beginPath();
    for(const d of drops){
      if(d.z<z0||d.z>=z1)continue;
      const span=H+len+200;let y=((d.y+spd*t)%span+span)%span-len-100;
      let x=d.x-WIND*y;x=((x%(W+200))+(W+200))%(W+200)-100;
      if(o.mask&&o.mask(x,y)<d.k)continue;
      g.moveTo(x,y);g.lineTo(x+WIND*len,y-len);}
    g.strokeStyle=o.color?o.color(zc,al):`rgba(165,184,214,${lerp(.09,.24,zc)*al})`;
    g.lineWidth=wid;g.lineCap='round';g.stroke();}
}
function flushNear(blur=2.5,a=1){ctx.save();ctx.globalAlpha=a;ctx.filter=`blur(${blur}px)`;ctx.drawImage(nearC,0,0);ctx.restore();nx.clearRect(0,0,W,H);}

// ---------------- 悬停的雨珠 ----------------
const beadS=(()=>{const c=mk(64,64),g=c.getContext('2d');
  let gr=g.createRadialGradient(32,32,0,32,32,22);
  gr.addColorStop(0,'rgba(255,240,215,.10)');gr.addColorStop(.72,'rgba(255,236,206,.32)');gr.addColorStop(1,'rgba(255,244,222,.95)');
  g.fillStyle=gr;g.beginPath();g.arc(32,32,22,0,TAU);g.fill();
  g.save();g.beginPath();g.arc(32,32,22,0,TAU);g.clip();
  g.fillStyle='rgba(255,250,236,.85)';g.beginPath();g.ellipse(34,47,13,6,0,0,TAU);g.fill();g.restore();
  g.fillStyle='#fff';g.beginPath();g.ellipse(24,22,5,3.2,-.6,0,TAU);g.fill();return c;})();
const softS=(()=>{const c=mk(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return c;})();
const bokehS=(()=>{const c=mk(96,96),g=c.getContext('2d');
  let gr=g.createRadialGradient(48,48,0,48,48,46);gr.addColorStop(0,'rgba(255,238,210,.16)');gr.addColorStop(.7,'rgba(255,238,210,.13)');
  gr.addColorStop(.9,'rgba(255,242,222,.2)');gr.addColorStop(1,'rgba(255,242,222,0)');g.filter='blur(2px)';g.fillStyle=gr;g.beginPath();g.arc(48,48,44,0,TAU);g.fill();return c;})();
function bead(x,y,r,a){ctx.globalAlpha=a;ctx.drawImage(beadS,x-r*1.45,y-r*1.45,r*2.9,r*2.9);
  gx.globalAlpha=a*.55;gx.drawImage(softS,x-r*4,y-r*4,r*8,r*8);}
function bokeh(x,y,r,a){ctx.globalAlpha=a;ctx.drawImage(bokehS,x-r,y-r,r*2,r*2);}

// ---------------- 黑羽 ----------------
function featherSprite(seed,blur){
  const r=rng(seed),L=136,wu=lerp(21,27,r()),wl=lerp(13,18,r()),c=mk(200,100),g=c.getContext('2d');
  if(blur)g.filter=`blur(${blur}px)`;
  g.translate(34,52);g.rotate(-.05);
  const up=()=>{g.moveTo(.04*L,-1);g.bezierCurveTo(.16*L,-wu*1.05,.66*L,-wu*1.02,L,-wu*.12);};
  const shape=()=>{g.beginPath();up();g.quadraticCurveTo(L*1.03,0,L*.96,wl*.12);
    g.bezierCurveTo(.68*L,wl*1.02,.22*L,wl*.98,.04*L,1.5);g.closePath();};
  shape();
  let gr=g.createLinearGradient(0,-wu,0,wl);gr.addColorStop(0,'#15131f');gr.addColorStop(.5,'#09080e');gr.addColorStop(1,'#030305');
  g.fillStyle=gr;g.fill();
  g.save();g.clip();
  // 冷色光泽带
  gr=g.createLinearGradient(0,-wu,L*.4,0);gr.addColorStop(0,'rgba(120,110,170,.0)');gr.addColorStop(.5,'rgba(130,120,190,.16)');gr.addColorStop(1,'rgba(120,110,170,0)');
  g.fillStyle=gr;g.fillRect(-10,-wu*1.2,L*1.2,wu*1.2);
  g.lineWidth=.7;
  for(let i=0;i<90;i++){const x=(.04+i/90*.96)*L;
    g.strokeStyle=`rgba(${60+r()*30|0},${58+r()*20|0},${84+r()*30|0},${.10+r()*.16})`;
    g.beginPath();g.moveTo(x,-.5);g.quadraticCurveTo(x+10,-wu*.55,x+26,-wu*1.2);g.stroke();
    g.beginPath();g.moveTo(x,.5);g.quadraticCurveTo(x+9,wl*.55,x+22,wl*1.2);g.stroke();}
  g.globalCompositeOperation='destination-out';
  for(let k=0;k<3;k++){const x=(.3+r()*.55)*L,s=k===1?1:-1,w=s<0?wu:wl;g.lineWidth=1.4+r()*1.2;
    g.beginPath();g.moveTo(x+(s<0?24:20),s*w*1.15);g.lineTo(x+4,s*w*.35);g.stroke();}
  g.restore();
  g.beginPath();up();g.strokeStyle='rgba(205,196,244,.32)';g.lineWidth=1;g.stroke();
  g.lineCap='round';g.beginPath();g.moveTo(-8,1.5);g.quadraticCurveTo(.4*L,.8,L*.9,-1);g.strokeStyle='rgba(70,66,88,.7)';g.lineWidth=1.6;g.stroke();
  g.beginPath();g.moveTo(-8,1.5);g.lineTo(.06*L,1.2);g.strokeStyle='rgba(120,114,140,.55)';g.lineWidth=2.2;g.stroke();
  return c;}
const FEA=[[],[]];for(let k=0;k<4;k++){FEA[0].push(featherSprite(k*13+1,0));FEA[1].push(featherSprite(k*13+1,3.5));}
function feather(g,x,y,ang,flip,sc,a,sp,blurry){
  if(a<=0.003)return;const s=FEA[blurry?1:0][sp&3];g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(ang);
  g.scale(sc,sc*(0.5+0.5*Math.abs(flip)));g.drawImage(s,-100,-50);g.restore();}
// 一直在落的羽（纯时间函数，可定格）
function makeFall(n,seed,o={}){const r=rng(seed),a=[];for(let i=0;i<n;i++){const z=r();
  a.push({x:(o.x0??0)+r()*(o.xw??W),y:r()*(H+400),z,v:lerp(45,120,z),A:lerp(20,70,r()),w:lerp(.6,1.3,r()),p:r()*TAU,
    q:r()*TAU,fw:lerp(.5,1.4,r()),sp:i,sc:lerp(.35,1.25,z)});}return a;}
function drawFall(t,list,a=1,o={}){
  for(const f of list){const span=H+400;const y=((f.y+f.v*t)%span+span)%span-200;
    const x=f.x+f.A*Math.sin(f.w*t+f.p);
    const ang=-Math.PI/2+.7*Math.cos(f.w*t+f.p)+(o.tilt??0);
    const near=f.z>.85,g=near?nx:ctx;
    feather(g,x,y,ang,Math.cos(f.fw*t+f.q),f.sc*(near?1.6:1),a*lerp(.55,1,f.z),f.sp,f.z<.25);}
}
// 从一点炸开的羽
function makeBurst(n,seed,x0,y0,o={}){const r=rng(seed),a=[];for(let i=0;i<n;i++){
  const ang=(o.ang??-Math.PI/2)+(r()-.5)*(o.spread??TAU),sp=lerp(o.vmin??200,o.vmax??900,r()**.6);
  a.push({x:x0+(r()-.5)*(o.jx??0),y:y0+(r()-.5)*(o.jy??0),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,d:(o.delay??0)*r(),
    g:lerp(50,120,r()),A:lerp(15,60,r()),w:lerp(.8,1.6,r()),p:r()*TAU,q:r()*TAU,fw:lerp(1,3,r()),
    spin:(r()-.5)*8,a0:r()*TAU,sc:lerp(.3,1.1,r()**1.5),sp:i,near:r()<.08});}return a;}
function drawBurst(u,list,a=1){
  for(const f of list){const v=u-f.d;if(v<0)continue;const k=1-Math.exp(-2.6*v);
    const x=f.x+f.vx*k/2.6+f.A*Math.sin(f.w*v+f.p)*clamp(v);
    const y=f.y+f.vy*k/2.6+f.g*v;
    const ang=f.a0+f.spin*k/2.6+(-Math.PI/2-f.a0)*clamp(v/2.5)+.5*Math.cos(f.w*v+f.p)*clamp(v);
    const al=a*ss(0,.08,v)*(1-ss(4.5,7,v));const g=f.near?nx:ctx;
    feather(g,x,y,ang,Math.cos(f.fw*v+f.q),f.sc*(f.near?2.2:1),al,f.sp,false);}
}

// ---------------- 刀光 ----------------
function slash(t,t0,x0,y0,x1,y1,o={}){
  const u=t-t0;if(u<0||u>2.2)return;
  const head=eo(u/.11),tail=eo((u-.04)/.22),fade=1-ss(.2,.5,u);
  const P=s=>[lerp(x0,x1,s),lerp(y0,y1,s)];
  if(fade>0&&head>tail){const [hx,hy]=P(head),[tx,ty]=P(tail);
    gx.save();gx.lineCap='round';gx.globalAlpha=fade;gx.strokeStyle=VIOLET_D;gx.lineWidth=34;gx.beginPath();gx.moveTo(tx,ty);gx.lineTo(hx,hy);gx.stroke();
    gx.strokeStyle=VIOLET;gx.lineWidth=14;gx.stroke();gx.strokeStyle='#fff';gx.lineWidth=5;gx.stroke();gx.restore();
    ctx.save();ctx.lineCap='round';ctx.globalAlpha=fade;const lg=ctx.createLinearGradient(tx,ty,hx,hy);
    lg.addColorStop(0,'rgba(183,146,246,0)');lg.addColorStop(.6,'rgba(230,220,255,.9)');lg.addColorStop(1,'#fff');
    ctx.strokeStyle=lg;ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();ctx.restore();}
  // 闪白两帧
  if(u>.06&&u<.13&&!o.noFlash){ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#e9e2ff';ctx.fillRect(0,0,W,H);ctx.restore();}
  // 留下的刀痕
  const scar=ss(.15,.3,u)*(1-ss(.5,2.2,u))*(o.scar??1);
  if(scar>0){gx.save();gx.globalAlpha=scar*.7;gx.strokeStyle=VIOLET;gx.lineWidth=3;gx.beginPath();gx.moveTo(x0,y0);gx.lineTo(x1,y1);gx.stroke();gx.restore();}
}

// ---------------- 字标 / 菜单 ----------------
function titleText(g,x,y,size,align,fill){
  g.font=`900 ${size}px ${F_HEAVY}`;g.letterSpacing=`${size*.07}px`;g.textAlign=align;g.textBaseline='alphabetic';
  g.fillStyle=fill;g.fillText('断晓',x+(align==='center'?size*.035:0),y);}
function latin(g,x,y,size,align,a){g.save();g.globalAlpha=a;g.font=`${size}px ${F_GOTH}`;g.letterSpacing='2px';g.textAlign=align;
  g.fillStyle='#c4cad8';g.shadowColor='rgba(0,0,0,.8)';g.shadowBlur=12;g.fillText('Lux Scissa',x,y);g.restore();}
function boneGrad(g,y,size,warm=1){const gr=g.createLinearGradient(0,y-size*.85,0,y+size*.08);
  gr.addColorStop(0,warm?'#fbf4e6':'#e8ecf4');gr.addColorStop(.55,warm?'#e6ded0':'#d0d6e2');gr.addColorStop(1,'#8e96a8');return gr;}
function divider(g,x,y,w,a,p,align='center'){
  if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle='rgba(188,195,210,.6)';g.lineWidth=1;
  const cx=align==='center'?x:x+w/2,hw=w/2*eo(p);
  g.beginPath();g.moveTo(cx-hw,y);g.lineTo(cx-20,y);g.moveTo(cx+20,y);g.lineTo(cx+hw,y);g.stroke();
  g.beginPath();g.moveTo(cx,y-9);g.lineTo(cx+7,y);g.lineTo(cx,y+9);g.lineTo(cx-7,y);g.closePath();g.stroke();
  g.fillStyle='rgba(188,195,210,.8)';[-28,28].forEach(d=>{g.beginPath();g.arc(cx+d,y,1.8,0,TAU);g.fill();});g.restore();}
function diamond(g,x,y,s){g.beginPath();g.moveTo(x,y-s);g.lineTo(x+s*.78,y);g.lineTo(x,y+s);g.lineTo(x-s*.78,y);g.closePath();g.fill();}
function menu(t,x,y,o={}){
  if(S.menuAt===null)return;const mt=t-S.menuAt,gap=o.gap||64,align=o.align||'center',out=o.out??1;
  ITEMS.forEach((it,i)=>{
    const a=eo((mt-.1-i*.07)/.4)*out;if(a<=0)return;
    const yy=y+i*gap+(1-a)*16,sel=i===S.sel,dis=DISABLED[i];
    ctx.save();ctx.globalAlpha=a;ctx.textAlign=align;ctx.textBaseline='middle';
    const sp=sel?12:9;ctx.letterSpacing=sp+'px';
    ctx.font=sel?`900 34px ${F_HEAVY}`:`400 31px ${F_SERIF}`;
    ctx.fillStyle=dis?'rgba(118,126,144,.36)':sel?'#f1ebde':'rgba(168,176,196,.78)';
    if(sel){ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=14;}
    const tw=ctx.measureText(it).width-sp;
    ctx.fillText(it,align==='center'?x+sp/2:x,yy);ctx.shadowBlur=0;
    if(sel){
      const cx=align==='center'?x:x+tw/2,k=(t-S.selAt),pop=1+.5*Math.max(0,1-k/.22);
      ctx.fillStyle=VIOLET;[-1,1].forEach(s=>diamond(ctx,cx+s*(tw/2+32),yy,6*pop));
      gx.save();gx.globalAlpha=a*.8;gx.fillStyle=VIOLET_D;[-1,1].forEach(s=>diamond(gx,cx+s*(tw/2+32),yy,14));gx.restore();
      const uw=tw+90,ux=cx-uw/2,uy=yy+29,p=eo(k/.35)*1;
      const lg=ctx.createLinearGradient(ux,0,ux+uw,0);lg.addColorStop(0,'rgba(200,206,222,0)');lg.addColorStop(.5,'rgba(222,226,238,.75)');lg.addColorStop(1,'rgba(200,206,222,0)');
      ctx.fillStyle=lg;ctx.fillRect(ux,uy,uw*p,1.2);ctx.fillStyle=VIOLET;ctx.fillRect(ux+uw*p-8,uy-.6,8,2.4);}
    ctx.restore();});
}
function pressKey(t,x,y,a,align='center'){
  if(a<=0)return;const out=S.menuAt===null?1:1-clamp((t-S.menuAt)/.25);if(out<=0)return;
  const br=.5+.5*Math.sin(t*2.3);ctx.save();ctx.globalAlpha=a*out*(.35+.55*br);ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.font=`400 24px ${F_SERIF}`;ctx.letterSpacing='14px';ctx.fillStyle='#c9cfdd';
  ctx.fillText('按任意键',align==='center'?x+7:x,y);
  const w=ctx.measureText('按任意键').width;const cx=align==='center'?x:x+w/2-7;
