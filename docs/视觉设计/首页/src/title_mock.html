<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>首页方向样图</title>
<style>
/* 首页会话 11-01：首页方向样图（第二版，按《沉影之昼》设定改）。素材全部来自项目现有文件，没有新出图。
   用法：title_mock.html?d=A|B|C|N&f=0..3&n=0|1|2
     d：方向（N = 三个候选名字标对比）；f=0 定稿画面，1～3 进场关键帧；n：游戏名 0 沉影之昼 / 1 断晓 / 2 五点五十九。
   Edge 无头 1280x720 截图（render.ps1）。字体和暂停菜单同一套：哥特字 Old English（发布换 UnifrakturMaguntia）+ 思源宋体特粗（Noto Serif SC 900）。
   颜色按设定集 §9：紫只给主角和斩光剑光；朱红只给钟面；昼光暖白到淡金；背景冷灰蓝。 */
:root{--ink:#06080d;--steel:#7f8ba0;--silver:#d6dbe4;--bone:#ece8de;--idle:#8f99ab;--faint:#6d778a;--violet:#9a6cff;--violet2:#c8b0ff;--dawn:#fff3dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:"Noto Serif SC",serif;color:var(--silver)}
.abs{position:absolute}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.bl{font-family:"Old English Text MT",serif;font-weight:400}
.hv{font-weight:900}
.rain{position:absolute;inset:0;pointer-events:none}
/* 铁艺分隔线（和暂停菜单同一个件） */
.iron{display:flex;align-items:center;justify-content:center;gap:9px}
.iron i{display:block;height:1px;background:linear-gradient(90deg,transparent,#8a93a6)}
.iron i.r{background:linear-gradient(90deg,#8a93a6,transparent)}
.iron b{width:4px;height:4px;border-radius:50%;background:#aab2c2}
.iron u{width:12px;height:12px;border:1px solid #c9cfdb;transform:rotate(45deg)}
/* 菜单项（和暂停菜单同一套：未选中宋体常规 + 宽字距，选中特粗 + 紫菱 + 银线） */
.menu li{list-style:none;font-size:21px;letter-spacing:9px;color:var(--idle);position:relative;white-space:nowrap}
.menu li.sel{color:var(--bone);font-weight:900}
.menu li.sel::before,.menu li.sel::after{content:"";position:absolute;top:50%;width:7px;height:7px;background:var(--violet);transform:translateY(-50%) rotate(45deg);box-shadow:0 0 8px var(--violet)}
.menu li.sel::before{left:-26px}.menu li.sel::after{right:-17px}
.menu li.sel .ul{position:absolute;left:-30px;right:-24px;bottom:-6px;height:1px;background:linear-gradient(90deg,transparent,#c9cfdb 40%,transparent)}
.menu li.sel .ul::before{content:"";position:absolute;left:30%;top:-1px;width:14px;height:3px;background:var(--violet2);filter:blur(1px)}
.feather{position:absolute;width:70px;height:28px;background:url(../../../../assets/image/ult/feather_1.png) center/contain no-repeat}
.feather.f2{background-image:url(../../../../assets/image/ult/feather_2.png)}
.foot{font-size:12px;letter-spacing:6px;color:var(--faint);font-weight:900}
.vow{font-size:13px;letter-spacing:5px;color:#7c8598}

/* ================= A　钟停 5:59 · 悬雨 ================= */
#A .sky{inset:0;background:url(../../../../assets/image/rain_street/sky.png) center 30%/cover;filter:brightness(.55) saturate(.8)}
#A .far{left:0;top:110px;width:1280px;height:720px;background:url(../../../../assets/image/rain_street/far_city.png) center top/100% auto no-repeat;opacity:.42;filter:brightness(.8)}
#A .near{left:-24px;top:20px;width:1853px;height:565px;background:url(../../../../assets/image/rain_street/near_plaza_complete_20261028.png) 0 0/100% 100% no-repeat;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 15%)}
#A .refl{left:-24px;top:498px;width:1853px;height:565px;background:url(../../../../assets/image/rain_street/near_plaza_complete_20261028.png) 0 100%/100% 100% no-repeat;transform:scaleY(-1);transform-origin:50% 0;
  opacity:.38;filter:blur(2.5px) brightness(.75) url(#ripple);-webkit-mask-image:linear-gradient(0deg,transparent 55%,#000 92%)}
#A .water{left:0;right:0;top:498px;bottom:0;background:linear-gradient(180deg,rgba(8,12,22,.55),rgba(4,6,12,.92))}
#A .quay{left:0;right:0;top:494px;height:6px;background:linear-gradient(180deg,#5d6a82,#1a2030);opacity:.8}
#A .veil{inset:0;background:linear-gradient(90deg,rgba(4,6,11,.93) 0,rgba(4,6,11,.82) 30%,rgba(4,6,11,.25) 52%,transparent 66%)}
#A .vign{inset:0;background:radial-gradient(ellipse at 66% 40%,transparent 35%,rgba(3,4,8,.75) 100%)}
#A .halo{left:770px;top:-40px;width:230px;height:260px;background:radial-gradient(ellipse 50% 50% at 50% 40%,rgba(255,240,210,.20),rgba(255,236,200,.06) 60%,transparent 75%)}
#A .hero{left:742px;top:409px;width:64px;height:93px;background:url(../../../../assets/image/characters/nightcrow/idle/frame_0001.png) center/contain no-repeat;transform:scaleX(-1)}
/* 积水里的影子：比本人长、更黑（替人老去的黑影） */
#A .heroR{left:736px;top:500px;width:76px;height:150px;background:url(../../../../assets/image/characters/nightcrow/idle/frame_0001.png) center top/contain no-repeat;transform:scale(-1,-1.15);transform-origin:50% 0;opacity:.55;filter:brightness(0) blur(1.6px) url(#ripple)}
#A .over{left:0;top:0;width:1280px;height:720px}
#A .tblock{left:92px;top:118px;width:470px}
#A .latin{font-size:30px;color:#c9cfdb;letter-spacing:1px;text-shadow:0 2px 0 #3c4454}
#A .cn{line-height:1.08;color:var(--bone);text-shadow:0 3px 0 #2a3040,0 0 30px rgba(0,0,0,.6);margin-top:4px;white-space:nowrap}
#A .sub{font-size:13px;letter-spacing:8px;color:var(--steel);margin-top:14px;font-weight:900}
#A .menu{left:0;right:0;top:575px;display:flex;justify-content:center;gap:58px}
#A .menu li{font-size:19px;letter-spacing:7px}
#A .menu li .r{position:absolute;left:0;top:30px;transform:scaleY(-1);opacity:.22;filter:blur(.8px) url(#ripple);color:inherit}
#A .menu li.sel .r{color:var(--violet2);opacity:.35}
#A .vow{left:0;right:0;top:672px;text-align:center}

/* ================= B　一刀 · 时间重新流动 ================= */
#B .bg{inset:-14px;background:url(../../UI/方向样图_20261031/src/bg.png) 14px 14px/1280px 720px;filter:blur(6px) saturate(.55) brightness(.75)}
#B .dim{inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(6,8,13,.70),rgba(6,8,13,.96))}
#B .dawnfill{display:none;inset:0;background:radial-gradient(ellipse at 50% 40%,#fffaf0,#f1e6cf 55%,#cdbd9d)}
#B .cut{left:0;right:0;top:268px;height:1px;background:linear-gradient(90deg,transparent 0,rgba(200,176,255,.30) 14%,#efe8ff 50%,rgba(200,176,255,.30) 86%,transparent 100%)}
#B .glow{left:0;right:0;top:252px;height:32px;background:radial-gradient(ellipse at 50% 50%,rgba(154,108,255,.22),transparent 70%);filter:blur(4px)}
#B .word{left:0;right:0;top:150px;height:240px;text-align:center;line-height:240px;color:var(--bone);font-weight:900;text-shadow:0 4px 0 #262b38;white-space:nowrap}
#B .top{clip-path:inset(0 0 50.4% 0);transform:translate(-11px,-3px)}
#B .bot{clip-path:inset(49.6% 0 0 0);transform:translate(11px,3px)}
#B .latin{left:0;right:0;top:100px;text-align:center;font-size:34px;color:#c9cfdb;text-shadow:0 2px 0 #3c4454}
#B .iron{position:absolute;left:0;right:0;top:420px}
#B .menu{left:0;right:0;top:452px;text-align:center}
#B .menu li{line-height:48px;display:table;margin:0 auto}
#B .vow{left:0;right:0;top:672px;text-align:center}

/* ================= C　睁眼 ================= */
#C{background:#030306}
#C .band{left:330px;top:150px;width:1060px;height:340px;background:url(../../../../assets/image/ult/eye/closeup_eye.png) 46% 42%/1640px auto no-repeat;
  filter:saturate(.75) brightness(.72) contrast(1.08);-webkit-mask-image:radial-gradient(ellipse 52% 46% at 50% 50%,#000 40%,transparent 100%)}
#C .lid{left:330px;top:150px;width:1060px;height:340px;background:linear-gradient(180deg,#030306 0,transparent 28%,transparent 72%,#030306 100%)}
#C .sideveil{inset:0;background:linear-gradient(90deg,#030306 0,#030306 24%,rgba(3,3,6,.6) 36%,transparent 50%)}
#C .vt{left:118px;top:80px;writing-mode:vertical-rl;color:var(--bone);font-weight:900;text-shadow:0 3px 0 #22262f;white-space:nowrap}
#C .latin{left:92px;top:96px;writing-mode:vertical-rl;font-size:24px;color:#aeb5c3;transform:rotate(180deg);transform-origin:center}
#C .ironv{left:262px;top:150px;width:1px;height:420px;background:linear-gradient(180deg,transparent,#8a93a6 30%,#8a93a6 70%,transparent)}
#C .ironv u{position:absolute;left:-6px;top:204px;width:12px;height:12px;border:1px solid #c9cfdb;transform:rotate(45deg);background:#030306}
#C .menu{left:300px;top:250px}
#C .menu li{line-height:50px;text-align:left}
#C .menu li.sel::before{left:-22px}#C .menu li.sel::after{display:none}
#C .vow{left:300px;top:660px;font-size:12px}
#C .glint{left:0;top:0;width:1280px;height:720px}

/* ================= N　候选名对比 ================= */
#N .bg{inset:-14px;background:url(../../UI/方向样图_20261031/src/bg.png) 14px 14px/1280px 720px;filter:blur(8px) saturate(.5) brightness(.6)}
#N .dim{inset:0;background:rgba(6,8,13,.86)}
#N .row{left:0;width:1280px;height:220px}
#N .row .latin{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:24px;color:#c9cfdb}
#N .row .w{position:absolute;left:0;right:0;top:50px;height:120px;line-height:120px;text-align:center;color:var(--bone);font-weight:900;text-shadow:0 3px 0 #262b38;white-space:nowrap}
#N .row .t{clip-path:inset(0 0 50.4% 0);transform:translate(-7px,-2px)}
#N .row .b{clip-path:inset(49.6% 0 0 0);transform:translate(7px,2px)}
#N .row .cutl{position:absolute;left:180px;right:180px;top:110px;height:1px;background:linear-gradient(90deg,transparent,#efe8ff 50%,transparent)}
#N .row .note{position:absolute;left:0;right:0;top:178px;text-align:center;font-size:13px;letter-spacing:4px;color:#7c8598}
#N .sep{left:340px;width:600px;height:1px;background:linear-gradient(90deg,transparent,#3a4152,transparent)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="ripple"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
  <radialGradient id="bead"><stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#ffeccc" stop-opacity=".85"/><stop offset="1" stop-color="#ffe2b0" stop-opacity="0"/></radialGradient>
</svg>

<!-- A -->
<div class="scene" id="A">
  <div class="abs sky"></div><div class="abs far"></div>
  <div class="abs water"></div><div class="abs refl"></div>
  <div class="abs near"></div><div class="abs quay"></div>
  <div class="abs heroR"></div><div class="abs hero"></div>
  <svg class="abs over" viewBox="0 0 1280 720" id="overA">
    <!-- 钟面：盖掉原图 4 点的指针，改成 5:59（设定） -->
    <circle cx="880" cy="98.6" r="25" fill="#c21d12" opacity=".9" filter="blur(2px)"/>
    <g stroke="#1a0503" stroke-linecap="round"><line x1="880" y1="98.6" x2="879.8" y2="113" stroke-width="3.2"/><line x1="880" y1="98.6" x2="877.6" y2="76" stroke-width="2"/></g>
    <circle cx="880" cy="98.6" r="2.4" fill="#1a0503"/>
    <!-- 钟楼顶上那缕没被斩断的昼光：一根暖白光弦绕着塔顶 -->
    <path id="thread" d="M792 30 C 830 8, 900 52, 945 22 S 990 40, 1010 6" fill="none" stroke="#fff4dc" stroke-width="1.6" opacity=".85" filter="blur(.4px)"/>
    <path d="M792 30 C 830 8, 900 52, 945 22 S 990 40, 1010 6" fill="none" stroke="#ffe7b8" stroke-width="7" opacity=".18" filter="blur(3px)"/>
    <g id="beadsA"></g>
  </svg>
  <div class="abs halo"></div>
  <div class="abs vign"></div><div class="abs veil"></div>
  <div class="abs tblock">
    <div class="bl latin tlatin"></div>
    <div class="cn hv tname"></div>
    <div class="iron" style="justify-content:flex-start;margin-top:10px"><b></b><u></u><b></b><i class="r" style="width:200px"></i></div>
    <div class="sub">雨　港 · 钟 楼 河 岸 街 · 试 玩 版</div>
  </div>
  <ul class="abs menu">
    <li class="sel">开始<span class="r">开始</span><span class="ul"></span></li>
    <li>操作说明<span class="r">操作说明</span></li>
    <li>设置<span class="r">设置</span></li>
    <li>退出<span class="r">退出</span></li>
  </ul>
  <div class="abs vow">愿你流血，愿你老去，愿你醒来时，已经在明天</div>
  <svg class="rain" id="rainA"></svg>
</div>

<!-- B -->
<div class="scene" id="B">
  <div class="abs bg"></div><div class="abs dim"></div>
  <div class="abs dawnfill"></div>
  <div class="abs glow"></div><div class="abs cut"></div>
  <div class="abs word top tname"></div><div class="abs word bot tname"></div>
  <div class="abs bl latin tlatin"></div>
  <div class="iron"><i style="width:150px"></i><b></b><u></u><b></b><i class="r" style="width:150px"></i></div>
  <ul class="abs menu">
    <li class="sel">开始<span class="ul"></span></li>
    <li>操作说明</li><li>设置</li><li>退出游戏</li>
  </ul>
  <div class="abs vow">愿你流血，愿你老去，愿你醒来时，已经在明天</div>
  <svg class="rain" id="beadsB" viewBox="0 0 1280 720"></svg>
  <div id="feathersB"></div>
  <svg class="rain" id="rainB"></svg>
</div>

<!-- C -->
<div class="scene" id="C">
  <div class="abs band"></div><div class="abs lid"></div>
  <svg class="abs glint" viewBox="0 0 1280 720"><defs><radialGradient id="gl"><stop offset="0" stop-color="#b48cff" stop-opacity=".35"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></radialGradient></defs>
    <circle cx="790" cy="300" r="70" fill="url(#gl)"/></svg>
  <div class="abs sideveil"></div>
  <div class="abs bl latin tlatin"></div>
  <div class="abs vt tname"></div>
  <div class="abs ironv"><u></u></div>
  <ul class="abs menu">
    <li class="sel">开始<span class="ul"></span></li>
    <li>操作说明</li><li>设置</li><li>退出游戏</li>
  </ul>
  <div class="abs vow">愿你醒来时，已经在明天</div>
  <div id="feathersC"></div>
  <svg class="rain" id="rainC"></svg>
</div>

<!-- N -->
<div class="scene" id="N">
  <div class="abs bg"></div><div class="abs dim"></div>
  <div id="rowsN"></div>
</div>

<script>
const q=new URLSearchParams(location.search);const d=q.get('d')||'A';const f=+(q.get('f')||0);const n=+(q.get('n')||0);
const NAMES=[
  {cn:'沉影之昼',la:'Umbra Mersa',note:'设定集主名：光停住人，时间沉进影子'},
  {cn:'断晓',la:'Lux Scissa',note:'“斩断永恒的光”，最短，字标最有力'},
  {cn:'五点五十九',la:'Ante Horam Sextam',note:'钟楼停住的那一分钟（拉丁文：第六个钟点之前）'}];
const N=NAMES[n];
document.getElementById(d).style.display='block';document.body.classList.add('f'+f);
document.querySelectorAll('#'+d+' .tname').forEach(e=>e.textContent=N.cn);
document.querySelectorAll('#'+d+' .tlatin').forEach(e=>e.textContent=N.la);
// 字号按名字长度缩
const len=N.cn.length;
const fsA={2:118,4:84,5:70}[len],fsB={2:178,4:132,5:112}[len],fsC={2:112,4:84,5:70}[len];
const lsA={2:22,4:10,5:6}[len],lsB={2:40,4:20,5:12}[len],lsC={2:30,4:14,5:8}[len];
document.querySelectorAll('#A .cn').forEach(e=>{e.style.fontSize=fsA+'px';e.style.letterSpacing=lsA+'px'});
document.querySelectorAll('#B .word').forEach(e=>{e.style.fontSize=fsB+'px';e.style.letterSpacing=lsB+'px';e.style.paddingLeft=lsB+'px'});
document.querySelectorAll('#C .vt').forEach(e=>{e.style.fontSize=fsC+'px';e.style.letterSpacing=lsC+'px'});
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
// 雨：可传入一个“昼光区”，区内雨滴悬停成珠子，区外照常落
function rain(id,cnt,col,a0,a1,zone){const g=document.getElementById(id);g.setAttribute('viewBox','0 0 1280 720');let h='';
  for(let i=0;i<cnt;i++){const x=rnd()*1400,y=rnd()*760-20,l=14+rnd()*26,a=a0+rnd()*(a1-a0);
    if(zone&&zone(x,y))continue;
    h+=`<line x1="${x}" y1="${y}" x2="${x-l*.22}" y2="${y+l}" stroke="${col}" stroke-opacity="${a.toFixed(2)}" stroke-width="1"/>`}g.innerHTML=h}
function beads(g,cnt,x0,x1,y0,y1,inside,rmax){let h='';for(let i=0;i<cnt;i++){const x=x0+rnd()*(x1-x0),y=y0+rnd()*(y1-y0);if(inside&&!inside(x,y))continue;
  const r=1.2+rnd()*rmax;h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*2.2).toFixed(1)}" fill="url(#bead)" opacity="${(.45+rnd()*.5).toFixed(2)}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*.55).toFixed(1)}" fill="#fff"/>`}
  g.insertAdjacentHTML('beforeend',h)}
function feathers(id,list){const g=document.getElementById(id);g.innerHTML=list.map(([x,y,r,sc,o,b,k])=>
  `<div class="feather ${k?'f2':''}" style="left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${sc});opacity:${o};filter:blur(${b}px)"></div>`).join('')}
const el=(sel)=>document.querySelector(sel);
if(d==='A'){
  const zone=(x,y)=>{const dx=(x-885)/120,dy=(y-90)/150;return dx*dx+dy*dy<1};
  rain('rainA',170,'#8492ab',.08,.30,f===3?null:zone);
  if(f!==3)beads(document.getElementById('beadsA'),90,760,1010,-10,250,zone,1.6);
  if(f===1){['.tblock','.menu','.vow','.hero','.heroR'].forEach(c=>el('#A '+c).style.opacity=0);el('#A').style.filter='brightness(.35)';}
  if(f===2){['.menu','.vow'].forEach(c=>el('#A '+c).style.opacity=0);el('#A .tblock').style.opacity=.45;el('#A .tblock').style.transform='translateY(16px)';}
  if(f===3){ // 按“开始”：一刀斩断塔顶光弦，悬停的雨砸下来，黑羽飘散
    ['.tblock','.menu','.vow','.halo'].forEach(c=>el('#A '+c).style.opacity=0);
    el('#thread').setAttribute('d','M792 30 C 830 8, 860 30, 872 34 M 896 36 C 920 30, 960 10, 1010 6');el('#thread').setAttribute('stroke','#d9c8ff');
    el('#overA').insertAdjacentHTML('beforeend','<line x1="830" y1="70" x2="950" y2="0" stroke="#efe8ff" stroke-width="2.5"/><line x1="820" y1="76" x2="960" y2="-6" stroke="#9a6cff" stroke-width="12" opacity=".25" filter="blur(4px)"/>');
    const fe=document.createElement('div');fe.id='feA';el('#A').appendChild(fe);
    feathers('feA',[[850,30,-30,.5,.9,0,0],[905,62,40,.4,.8,0,1],[870,120,-10,.45,.7,.5,0],[940,96,20,.35,.6,.8,1],[815,150,-50,.4,.5,1,0]]);
  }
}
if(d==='B'){
  feathers('feathersB',[[300,300,-28,.8,.85,0,0],[515,352,14,.6,.6,.6,1],[760,318,-60,.7,.75,0,0],[905,402,32,.5,.45,1,1],[640,560,-10,.55,.35,1.4,0],[1010,290,-35,.65,.7,0,1],[188,470,24,.45,.3,1.6,1]]);
  rain('rainB',150,'#8492ab',.06,.24);
  if(f===1||f===2){ // 昼光：整屏暖白，雨停在半空成珠
    ['.cut','.glow','.menu','.vow','.iron','#feathersB','.latin','#rainB'].forEach(c=>el('#B '+c).style.display='none');
    el('#B .dawnfill').style.display='block';
    document.querySelectorAll('#B .word').forEach(w=>{w.style.transform='none';w.style.color='#fffdf6';w.style.textShadow='0 0 40px #fff0cc,0 2px 0 #e6d7b8'});
    const g=document.getElementById('beadsB');g.innerHTML='<radialGradient id="bead2"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d9c49a" stop-opacity=".7"/><stop offset="1" stop-color="#b59a66" stop-opacity="0"/></radialGradient>';
    let h='';for(let i=0;i<150;i++){const x=rnd()*1280,y=rnd()*720,r=1.2+rnd()*2.2;h+=`<circle cx="${x}" cy="${y}" r="${r*2.2}" fill="url(#bead2)" opacity=".8"/><circle cx="${x}" cy="${y}" r="${r*.5}" fill="#fff"/>`}g.insertAdjacentHTML('beforeend',h);
  }
  if(f===2){ // 一刀横斩：冷紫刀光
    el('#B .cut').style.display='block';el('#B .glow').style.display='block';
    el('#B .cut').style.background='linear-gradient(90deg,transparent 0,#fff 3%,#efe8ff 58%,#9a6cff 61%,transparent 63%)';el('#B .cut').style.height='3px';
    el('#B .glow').style.background='linear-gradient(90deg,transparent,rgba(154,108,255,.55) 40%,rgba(154,108,255,.55) 60%,transparent 64%)';
  }
  if(f===3){['.menu','.vow','.iron'].forEach(c=>el('#B '+c).style.display='none');el('#B .latin').style.opacity=.5;
    el('#B .top').style.transform='translate(-22px,-6px)';el('#B .bot').style.transform='translate(22px,6px)';
    el('#B .glow').style.background='radial-gradient(ellipse at 50% 50%,rgba(154,108,255,.5),transparent 70%)';}
}
if(d==='C'){rain('rainC',120,'#7d88a0',.05,.22);
  feathers('feathersC',[[1140,120,-40,1.6,.55,3,0],[460,560,20,1.2,.4,2.5,1],[1020,560,-12,.9,.6,.8,0],[700,90,50,.7,.35,1,1]]);
  if(f===1){['.band','.lid','.sideveil','.latin','.vt','.ironv','.menu','.vow','#feathersC'].forEach(c=>el('#C '+c).style.opacity=0);el('#C .glint').innerHTML='<circle cx="790" cy="300" r="22" fill="#b48cff" opacity=".55" filter="blur(6px)"/><circle cx="790" cy="300" r="5" fill="#e8dcff"/>';}
  if(f===2){['.latin','.vt','.ironv','.menu','.vow'].forEach(c=>el('#C '+c).style.opacity=0);el('#C .band').style.webkitMaskImage='radial-gradient(ellipse 30% 14% at 50% 50%,#000 30%,transparent 100%)';}
  if(f===3){['.menu','.vow'].forEach(c=>el('#C '+c).style.opacity=0);el('#C .vt').style.opacity=.5;el('#C .latin').style.opacity=.3;}
}
if(d==='N'){el('#rowsN').innerHTML=NAMES.map((m,i)=>{const fs={2:100,4:84,5:72}[m.cn.length],ls={2:30,4:16,5:10}[m.cn.length];
  return `<div class="abs row" style="top:${10+i*236}px"><div class="bl latin">${m.la}</div>
  <div class="w t" style="font-size:${fs}px;letter-spacing:${ls}px;padding-left:${ls}px">${m.cn}</div><div class="w b" style="font-size:${fs}px;letter-spacing:${ls}px;padding-left:${ls}px">${m.cn}</div>
  <div class="cutl"></div><div class="note">${m.note}</div></div>`+(i<2?`<div class="abs sep" style="top:${236+i*236}px"></div>`:'')}).join('');}
</script>
