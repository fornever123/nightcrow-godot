<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>首页动态样片 · 光上影下</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* 首页会话 11-01：首页动态样片「光上影下 · 影子先动」。
   上半：昼光里的白瓷世界，时间停着——雨珠悬在半空，字像刻在白瓷上，动作只会僵硬地一顿一顿跟上。
   下半：一池黑水倒影，时间在走——水在流，倒影里的雨一直往水面落，倒影里的字和光标永远先动 0.6 秒。
   开场是 5:59 的交接：地平线上的旧光一熄、新光一亮，是同一瞬间。
   实现：两张 2D 画布（光面内容 / 影面内容）→ WebGL 片元着色器合成（白瓷开片底、光柱、水面波纹法线、倒影折射、涟漪、墨的拖尾）。
   按键：←→ 选菜单（看倒影先动）　R 重播　N 换游戏名　空格 暂停 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020305;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
.hint{position:fixed;right:14px;bottom:10px;font:12px/1.4 "Noto Serif SC",serif;color:#555c6b;letter-spacing:2px}
</style></head>
<body>
<div id="stage"><canvas id="gl" width="1280" height="720"></canvas></div>
<div class="hint">← → 选菜单（看倒影先动）　R 重播　N 换游戏名　空格 暂停</div>
<script>
'use strict';
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`translate(${-640*s}px,${-360*s}px) scale(${s})`;}
addEventListener('resize',fit);fit();

const W=1280,H=720,HZ=446;               // 水平线（光与影的分界）
const TITLE_Y=300,MENU_Y=404,LATIN_Y=196;
const LAG=0.6,STEP=1/7;                   // 本体比影子慢 0.6 秒，而且一秒只动 7 下
const NAMES=[['断晓','Lux Scissa'],['沉影之昼','Umbra Mersa'],['五点五十九','Ante Horam Sextam']];
const MENU=['开始','操作说明','设置','退出'];
let nameIdx=+(new URLSearchParams(location.search).get('n')||0);

// ---------------------------------------------------------------- 两张内容画布
const LC=document.createElement('canvas');LC.width=W;LC.height=H;const lc=LC.getContext('2d');
const SC=document.createElement('canvas');SC.width=W;SC.height=H;const sc=SC.getContext('2d');

// ---------------------------------------------------------------- WebGL
const gl=document.getElementById('gl').getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
const VS=`#version 300 es
in vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;
const FS=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;
uniform sampler2D uL,uS;uniform float t,flood,oldSun,swapFlash,HZ;uniform vec4 rip[16];
const vec2 SZ=vec2(1280.,720.);
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.03;a*=.5;}return v;}
// 白瓷开片：到 Voronoi 边的距离
float voro(vec2 x){vec2 n=floor(x),f=fract(x),mr;float md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 oo=vec2(hash(n+g),hash(n+g+17.3));vec2 r=g+oo-f;float d=dot(r,r);if(d<md){md=d;mr=r;}}
  md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 oo=vec2(hash(n+g),hash(n+g+17.3));vec2 r=g+oo-f;
    if(dot(mr-r,mr-r)>1e-5)md=min(md,dot(.5*(mr+r),normalize(r-mr)));}
  return md;}
vec3 sky(vec2 p){
  float h=clamp((HZ-p.y)/HZ,0.,1.);
  vec3 c=mix(vec3(1.,.987,.962),vec3(.872,.858,.835),pow(h,.75));
  c+=vec3(1.,.93,.80)*exp(-pow((HZ-p.y)/30.,2.))*.20;                  // 贴着水平线的一层暖光
  float sh=pow(.5+.5*sin(p.x*.0105+p.y*.0042+1.3),7.)*.06+pow(.5+.5*sin(p.x*.0061-p.y*.0031+4.),9.)*.05;
  c+=vec3(1.,.96,.88)*sh*h;                                              // 斜落的几道淡光
  vec2 wp=p+vec2(fbm(p*.01),fbm(p*.01+7.))*30.;                          // 让裂纹不那么规整
  float e=voro(wp*.019),e2=voro(wp*.047+3.1);
  float cr=max(1.-smoothstep(0.,.010,e),(1.-smoothstep(0.,.008,e2))*.5);
  c*=1.-cr*.032*(.3+.7*h);                                               // 釉面开片：极细、极淡
  c*=1.-.07*smoothstep(.35,1.,h)*smoothstep(.2,1.,abs(p.x-640.)/640.);   // 上角压一点暗
  return c;}
float waveH(vec2 p){
  float k=clamp((p.y-HZ)/(720.-HZ),0.,1.);
  float h=sin(p.x*.043+t*1.6+sin(p.y*.075-t*1.05)*1.6)*(.35+1.3*k);
  h+=sin(p.x*.0125-t*.85+p.y*.048)*(.25+1.1*k);
  h+=(fbm(vec2(p.x*.008,p.y*.034)+vec2(t*.05,-t*.32))-.5)*3.2*k;
  for(int i=0;i<16;i++){vec4 r=rip[i];if(r.z<=0.)continue;float age=t-r.y;if(age<0.||age>3.2)continue;
    float de=length(vec2(p.x-r.x,(p.y-HZ)*3.4));float R=age*64.;
    h+=sin((de-R)*.30)*exp(-abs(de-R)*.075)*exp(-age*1.3)*r.z;}
  return h;}
void main(){
  vec2 p=vec2(vUv.x*SZ.x,(1.-vUv.y)*SZ.y);
  vec3 dark=vec3(.016,.018,.027);
  vec3 c;
  float lmAbove=0.;
  if(p.y<HZ){
    float h=(HZ-p.y)/HZ;
    float m=1.-smoothstep(flood-.14,flood,h);
    vec3 lit=sky(p);
    vec4 L=texture(uL,p/SZ);lit=lit*(1.-L.a)+L.rgb;
    vec3 pre=dark+vec3(.9,.44,.15)*oldSun*exp(-pow((HZ-p.y)/46.,2.))*exp(-pow((p.x-640.)/380.,2.))*.55;
    c=mix(pre,lit,m);
  }else{
    float k=(p.y-HZ)/(720.-HZ);
    float h0=waveH(p),hx=waveH(p+vec2(1.,0.))-h0,hy=waveH(p+vec2(0.,1.))-h0;
    vec2 d=vec2(hx*9.,hy*5.);
    d.x+=(fbm(vec2(p.x*.004,p.y*.02)+vec2(-t*.05,t*.12))-.5)*15.*k;
    vec2 m=vec2(p.x+d.x,HZ-(p.y-HZ)+d.y);m.y=clamp(m.y,1.,HZ-1.);
    float lm=1.-smoothstep(flood-.14,flood,(p.y-HZ)/(720.-HZ)*.6);
    vec3 refl=sky(m)*mix(.34,.035,pow(k,.42))*vec3(.84,.88,1.);
    vec3 n=normalize(vec3(-hx*1.7,-hy*1.7,1.));
    float sp=pow(max(dot(n,normalize(vec3(0.,.5,.86))),0.),46.)*(1.-k*.85)*.42;
    refl+=vec3(1.,.97,.92)*sp;
    vec4 S=texture(uS,m/SZ);
    float tr=texture(uS,(m-vec2(0.,6.+4.*sin(p.x*.05+t*1.3)))/SZ).a*.38+texture(uS,(m-vec2(0.,15.))/SZ).a*.16;  // 墨往深处拖
    vec3 w=refl*(1.-tr*.85);w=w*(1.-S.a)+S.rgb;
    c=mix(dark,w,lm);
    lmAbove=lm;
  }
  float line=exp(-pow((p.y-HZ)/1.25,2.));
  c+=vec3(1.,.97,.9)*line*(.55*clamp(flood*3.,0.,1.)+swapFlash*1.5);
  c+=vec3(1.,.97,.92)*swapFlash*exp(-abs(p.y-HZ)/34.)*.9;
  c+=vec3(1.,.55,.2)*line*oldSun*exp(-pow((p.x-640.)/420.,2.))*1.2;
  vec2 q=vUv-.5;c*=1.-dot(q*vec2(1.,.9),q*vec2(1.,.9))*.55;
  c+=(hash(p+fract(t)*97.)-.5)*.018;
  o=vec4(c,1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const pg=gl.createProgram();gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.bindAttribLocation(pg,0,'aPos');gl.linkProgram(pg);gl.useProgram(pg);
const u={};for(const n of ['uL','uS','t','flood','oldSun','swapFlash','HZ','rip'])u[n]=gl.getUniformLocation(pg,n);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
function mkTex(unit){const tx=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return tx;}
const txL=mkTex(0),txS=mkTex(1);gl.uniform1i(u.uL,0);gl.uniform1i(u.uS,1);gl.uniform1f(u.HZ,HZ);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
const ripData=new Float32Array(64);let ripIdx=0;
function ripple(x,t,amp){ripData.set([x,t,amp,0],ripIdx*4);ripIdx=(ripIdx+1)%16;}

// ---------------------------------------------------------------- 工具
const sstep=(a,b,x)=>{x=Math.min(Math.max((x-a)/(b-a),0),1);return x*x*(3-2*x);};
const easeOut=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const R=(a,b)=>a+Math.random()*(b-a);
const lagT=t=>Math.floor((t-LAG)/STEP)*STEP;     // 本体看到的时间：晚 0.6 秒、一顿一顿

// ---------------------------------------------------------------- 时间轴（影子用 t，本体用 lagT(t)）
const T={swap:1.5,title:2.1,latin:2.6,menu:3.0,twitch:5.2};
const A={
  title:t=>sstep(T.title,T.title+.7,t),
  latin:t=>sstep(T.latin,T.latin+.7,t),
  menu:(i,t)=>sstep(T.menu+i*.14,T.menu+.5+i*.14,t),
  marker:t=>sstep(T.menu+.7,T.menu+1.1,t)};
let selEvents=[{t:0,from:0,to:0}],sel=0;
function markerPos(t){let x=0;for(const e of selEvents){if(t<e.t)break;x=e.from+(e.to-e.from)*easeOut((t-e.t)/.32);}return x;}
let twitches=[];      // 影子里的字自己动一下（歪、探、抖），本体隔 0.6 秒才僵硬地照做
function charPose(i,t){let dx=0,dy=0,rot=0;for(const e of twitches){if(e.i!==i&&e.i!==-1)continue;const a=t-e.t;if(a<0||a>1.6)continue;
  const env=a<.22?easeOut(a/.22):1-sstep(.5,1.6,a);dx+=e.dx*env;dy+=e.dy*env;rot+=e.rot*env;}return {dx,dy,rot};}

// ---------------------------------------------------------------- 雨珠（光面里停着）和它们的影子（水里一直在落）
let beads=[];
function makeBeads(){beads=[];let s=5;const rr=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<150;i++){const x=rr()*W,y=12+rr()*(HZ-40);
    if(Math.abs(y-TITLE_Y)<80&&Math.abs(x-640)<260&&rr()<.7)continue;   // 字附近少一点
    beads.push({x,y,r:1.1+rr()*2.4,glint:rr()*6.28,fall:1.2+rr()*2.6,ph:rr()*3,last:0,live:rr()<.42});}}

// ---------------------------------------------------------------- 画内容
let menuX=[];
function layoutMenu(){lc.font='21px "Noto Serif SC"';menuX=[];const gap=64;const ws=MENU.map(m=>lc.measureText(m).width+(m.length-1)*7);
  let x=640-(ws.reduce((a,b)=>a+b,0)+gap*(MENU.length-1))/2;for(const w of ws){menuX.push({x:x+w/2,w});x+=w+gap;}}
function spaced(ctx,s,cx,cy,sp,poseFn){const ws=[...s].map(ch=>ctx.measureText(ch).width);const total=ws.reduce((a,b)=>a+b,0)+sp*(s.length-1);
  let x=cx-total/2;[...s].forEach((ch,i)=>{const p=poseFn?poseFn(i):{dx:0,dy:0,rot:0};ctx.save();ctx.translate(x+ws[i]/2+p.dx,cy+p.dy);ctx.rotate(p.rot);ctx.fillText(ch,0,0);ctx.restore();x+=ws[i]+sp;});}
function titleFont(){const n=NAMES[nameIdx][0].length;return {fs:{2:150,4:112,5:96}[n],sp:{2:44,4:22,5:14}[n]};}

function drawLight(t){ // 光面：本体，时间 = lagT(t)
  const lt=lagT(t);lc.clearRect(0,0,W,H);lc.textAlign='center';lc.textBaseline='middle';
  // 雨珠：停在半空，只有高光在微微闪
  for(const b of beads){const g=.55+.45*Math.sin(t*.8+b.glint);
    lc.save();lc.translate(b.x,b.y);lc.scale(1,1.45);
    const gr=lc.createRadialGradient(-b.r*.25,-b.r*.3,0,0,0,b.r);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.55,'rgba(236,228,212,.55)');gr.addColorStop(.85,'rgba(150,136,112,.55)');gr.addColorStop(1,'rgba(150,136,112,0)');
    lc.fillStyle=gr;lc.beginPath();lc.arc(0,0,b.r,0,6.283);lc.fill();
    lc.fillStyle=`rgba(255,255,255,${.85*g})`;lc.beginPath();lc.arc(-b.r*.32,-b.r*.35,b.r*.28,0,6.283);lc.fill();lc.restore();}
  const {fs,sp}=titleFont();const [cn,la]=NAMES[nameIdx];
  // 字标：刻在白瓷上（亮字 + 右下暗影 + 左上高光）
  const ta=A.title(lt);
  if(ta>0){lc.globalAlpha=ta;lc.font=`900 ${fs}px "Noto Serif SC"`;
    lc.shadowColor='rgba(78,64,44,.62)';lc.shadowBlur=9;lc.shadowOffsetX=3;lc.shadowOffsetY=5;lc.fillStyle='#ece5d8';
    spaced(lc,cn,640+sp/2*0,TITLE_Y,sp,i=>charPose(i,lt));
    lc.shadowColor='rgba(255,255,255,.95)';lc.shadowBlur=1;lc.shadowOffsetX=-1.2;lc.shadowOffsetY=-1.2;lc.fillStyle='#e6dfd1';
    spaced(lc,cn,640,TITLE_Y,sp,i=>charPose(i,lt));
    lc.shadowColor='transparent';lc.globalAlpha=1;}
  const la_=A.latin(lt);
  if(la_>0){lc.globalAlpha=la_*.9;lc.font='30px "Old English Text MT"';lc.shadowColor='rgba(255,255,255,.9)';lc.shadowOffsetX=-1;lc.shadowOffsetY=-1;lc.shadowBlur=0;
    lc.fillStyle='#8f8576';lc.fillText(la,640,LATIN_Y);lc.shadowColor='transparent';lc.globalAlpha=1;}
  // 菜单（刻字）
  lc.font='21px "Noto Serif SC"';
  MENU.forEach((m,i)=>{const a=A.menu(i,lt);if(a<=0)return;lc.globalAlpha=a;const on=Math.round(markerPos(lt))===i;
    lc.font=(on?'900 ':'')+'21px "Noto Serif SC"';lc.fillStyle=on?'#4a433a':'#8d8578';
    lc.shadowColor='rgba(255,255,255,.95)';lc.shadowOffsetX=-1;lc.shadowOffsetY=-1;spaced(lc,m,menuX[i].x,MENU_Y,7);lc.shadowColor='transparent';});
  lc.globalAlpha=1;
  // 选中标记：一对紫菱 + 银线（本体：晚半拍、一顿一顿）
  drawMarker(lc,markerPos(lt),A.marker(lt),false);
}
function drawMarker(ctx,pos,a,shadow){if(a<=0)return;const i0=Math.floor(pos),f=pos-i0,i1=Math.min(i0+1,MENU.length-1);
  const x=menuX[i0].x+(menuX[i1].x-menuX[i0].x)*f,w=menuX[i0].w+(menuX[i1].w-menuX[i0].w)*f;
  ctx.save();ctx.globalAlpha=a;
  for(const s of [-1,1]){ctx.save();ctx.translate(x+s*(w/2+20),MENU_Y);ctx.rotate(Math.PI/4);
    ctx.fillStyle=shadow?'#2a1650':'#8a5cf0';if(!shadow){ctx.shadowColor='rgba(138,92,240,.6)';ctx.shadowBlur=8;}else{ctx.shadowColor='rgba(120,70,255,.9)';ctx.shadowBlur=14;}
    ctx.fillRect(-4,-4,8,8);ctx.restore();}
  const g=ctx.createLinearGradient(x-w/2-26,0,x+w/2+26,0);const col=shadow?'0,0,0':'110,100,86';g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.45,`rgba(${col},.8)`);g.addColorStop(1,`rgba(${col},0)`);
  ctx.fillStyle=g;ctx.fillRect(x-w/2-26,MENU_Y+18,w+52,1.3);ctx.restore();}

function drawShadow(t,dt){ // 影面：时间 = t（真实时间，永远先动）
  sc.clearRect(0,0,W,H);sc.textAlign='center';sc.textBaseline='middle';
  const live=t>T.swap;
  for(const b of beads){
    sc.fillStyle='rgba(0,0,0,.55)';sc.beginPath();sc.ellipse(b.x,b.y,b.r*.9,b.r*1.3,0,0,6.283);sc.fill();   // 本体的影子：一颗黑珠
    if(!live||!b.live)continue;
    const s=((t-T.swap+b.ph)%b.fall)/b.fall;                    // 影子里的那颗雨还在落，一直落到水面
    if(s<b.last)ripple(b.x,t,R(.5,1.1));b.last=s;
    const e=s*s;const y=b.y+(HZ-b.y)*e;const v=2*s*(HZ-b.y)/b.fall;const len=Math.min(26,4+v*.03);
    sc.strokeStyle=`rgba(0,0,0,${.7*sstep(0,.08,s)})`;sc.lineWidth=b.r*.55+.4;sc.lineCap='round';
    sc.beginPath();sc.moveTo(b.x,y-len);sc.lineTo(b.x,y);sc.stroke();}
  const {fs,sp}=titleFont();const [cn,la]=NAMES[nameIdx];
  const ta=A.title(t);
  if(ta>0){sc.globalAlpha=ta;sc.font=`900 ${fs}px "Noto Serif SC"`;sc.fillStyle='#000';spaced(sc,cn,640,TITLE_Y,sp,i=>charPose(i,t));sc.globalAlpha=1;}
  const la_=A.latin(t);if(la_>0){sc.globalAlpha=la_*.9;sc.font='30px "Old English Text MT"';sc.fillStyle='#000';sc.fillText(la,640,LATIN_Y);sc.globalAlpha=1;}
  MENU.forEach((m,i)=>{const a=A.menu(i,t);if(a<=0)return;sc.globalAlpha=a;const on=Math.round(markerPos(t))===i;
    sc.font=(on?'900 ':'')+'21px "Noto Serif SC"';sc.fillStyle='#000';spaced(sc,m,menuX[i].x,MENU_Y,7);});
  sc.globalAlpha=1;
  drawMarker(sc,markerPos(t),A.marker(t),true);
}

// ---------------------------------------------------------------- 主循环
let t0=performance.now(),paused=false,pauseAt=0,nextTwitch=T.twitch;
function restart(){t0=performance.now();selEvents=[{t:0,from:0,to:0}];sel=0;twitches=[];nextTwitch=T.twitch;ripData.fill(0);makeBeads();layoutMenu();}
const AT=new URLSearchParams(location.search).get('at');   // 截图用：?at=秒数 把画面定在那个时刻
function frame(now){requestAnimationFrame(frame);if(paused)return;
  const t=AT!==null?+AT:(now-t0)/1000;
  if(t>nextTwitch){nextTwitch=t+R(3.2,5.5);const n=NAMES[nameIdx][0].length;
    const whole=Math.random()<.3;twitches.push({t,i:whole?-1:(Math.random()*n)|0,dx:R(-7,7),dy:R(-9,3),rot:R(-.07,.07)});twitches=twitches.filter(e=>t-e.t<3);}
  drawLight(t);drawShadow(t);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,txL);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,LC);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,txS);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,SC);
  gl.uniform1f(u.t,t);
  gl.uniform1f(u.flood,t<T.swap?0:easeOut((t-T.swap)/.9)*1.25);
  gl.uniform1f(u.oldSun,(t<T.swap?sstep(.1,1.2,t):0));            // 旧光一熄……
  gl.uniform1f(u.swapFlash,t<T.swap?0:Math.exp(-(t-T.swap)*4));   // ……新光一亮，同一瞬间
  gl.uniform4fv(u.rip,ripData);
  gl.viewport(0,0,W,H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function select(d){const t=(performance.now()-t0)/1000;const from=markerPos(t);sel=(sel+d+MENU.length)%MENU.length;selEvents.push({t,from,to:sel});
  ripple(menuX[sel].x,t,1.2);}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='ArrowDown')select(1);
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowUp')select(-1);
  if(e.key==='r'||e.key==='R')restart();
  if(e.key==='n'||e.key==='N'){nameIdx=(nameIdx+1)%NAMES.length;}
  if(e.key===' '){paused=!paused;if(paused)pauseAt=performance.now();else t0+=performance.now()-pauseAt;e.preventDefault();}});
Promise.all([document.fonts.load('900 150px "Noto Serif SC"'),document.fonts.load('21px "Noto Serif SC"'),document.fonts.load('30px "Old English Text MT"')]).catch(()=>{}).then(()=>{restart();requestAnimationFrame(frame);});
</script>
