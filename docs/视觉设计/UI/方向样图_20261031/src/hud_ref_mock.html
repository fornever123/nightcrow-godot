<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>参考网上 HUD 的模仿版</title>
<!-- UI 会话 11-01：用户“你去网上找好看的ui模仿”。左上骨架照 Ender Magnolia / Ender Lilies（菱形徽记 + 下挂尖饰 + 两头箭头的双线细血条 + 一排小菱形），
     右上照鬼泣 5 的评价（大字母 + 斜着往下排的评语），装饰全部用暂停菜单那一套（银色哥特字、粗宋体、发丝线、紫菱）。?s=normal|full|low -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(bg.png) 0 0/1280px 720px}
svg{position:absolute;inset:0}
.blk{font-family:"Old English Text MT",serif}
.song{font-family:"Source Han Serif SC Heavy","Source Han Serif SC",serif;font-weight:900}
.num{font-family:Georgia,serif;font-style:italic}
</style></head><body><div class="bg"></div>
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#e3e7ee"/><stop offset=".52" stop-color="#9aa2b2"/><stop offset="1" stop-color="#cfd4dd"/></linearGradient>
 <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset="1" stop-color="#bdb6a8"/></linearGradient>
 <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c25866"/><stop offset="1" stop-color="#5e1420"/></linearGradient>
 <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#c9cfda" stop-opacity=".85"/><stop offset="1" stop-color="#c9cfda" stop-opacity="0"/></linearGradient>
 <linearGradient id="fadeL" x1="1" x2="0"><stop offset="0" stop-color="#c9cfda" stop-opacity=".85"/><stop offset="1" stop-color="#c9cfda" stop-opacity="0"/></linearGradient>
 <radialGradient id="vio" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#efe6ff"/><stop offset=".45" stop-color="#b48cff"/><stop offset="1" stop-color="#6e4bd6"/></radialGradient>
 <radialGradient id="shadeL" cx="0" cy="0" r="1"><stop offset="0" stop-color="#05060a" stop-opacity=".78"/><stop offset=".55" stop-color="#05060a" stop-opacity=".45"/><stop offset="1" stop-color="#05060a" stop-opacity="0"/></radialGradient>
 <radialGradient id="shadeR" cx="1" cy="0" r="1"><stop offset="0" stop-color="#05060a" stop-opacity=".75"/><stop offset=".6" stop-color="#05060a" stop-opacity=".35"/><stop offset="1" stop-color="#05060a" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="drop"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".85"/></filter>
</defs>
<g id="hud"></g>
</svg>
<script>
const S=new URLSearchParams(location.search).get('s')||'normal';
const hp=S==='low'?18:75, ult=S==='full'?5:(S==='low'?2:3), full=S==='full', low=S==='low';
const NS='http://www.w3.org/2000/svg', g=document.getElementById('hud');
function el(t,a,parent=g){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);parent.appendChild(e);return e}
function txt(s,a,parent=g){const e=el('text',a,parent);e.textContent=s;return e}
function dia(cx,cy,r,a){return el('path',Object.assign({d:`M${cx} ${cy-r}L${cx+r} ${cy}L${cx} ${cy+r}L${cx-r} ${cy}Z`},a))}

// ---- 暗底：左上、右上各一片向外渐隐的暗色，亮处也看得清 ----
el('rect',{x:0,y:0,width:560,height:190,fill:'url(#shadeL)'});
el('rect',{x:900,y:0,width:380,height:260,fill:'url(#shadeR)'});

// ---- 左上：菱形徽记（Magnolia）----
const cx=58, cy=56;
const em=el('g',{filter:'url(#drop)'});
el('path',{d:`M${cx} ${cy-44}L${cx+3} ${cy-36}L${cx} ${cy-33}L${cx-3} ${cy-36}Z`,fill:'#c9cfda'},em);           // 顶上小尖
dia(cx,cy,30,{fill:'#07090e',stroke:'url(#silver)','stroke-width':1.6},em);                                   // 外菱
dia(cx,cy,25,{fill:'none',stroke:'#8d96a8','stroke-width':1},em);                                             // 内菱
for(const dx of [-6,0,6]){const l=dx?26:34; el('path',{d:`M${cx+dx} ${cy+30}L${cx+dx} ${cy+30+l}`,stroke:dx?'#8d96a8':'#c9cfda','stroke-width':dx?1:1.4},em);} // 下挂三线（Magnolia）
el('path',{d:`M${cx-4} ${cy+64}L${cx} ${cy+72}L${cx+4} ${cy+64}`,fill:'none',stroke:'#c9cfda','stroke-width':1.2},em);    // 尖
el('circle',{cx:cx-36,cy:cy,r:1.6,fill:'#aab2c0'},em); el('circle',{cx:cx+36,cy:cy,r:1.6,fill:'#aab2c0'},em);  // 两侧小圆点（暂停菜单）
// 菱里的紫：绝影攒得越多越大，满了发光
const k=ult/5, r=4+15*k;
dia(cx,cy,r,{fill:'url(#vio)',filter:full?'url(#glowBig)':'url(#glow)',opacity:full?1:.55+.45*k});
if(full){dia(cx,cy,r+6,{fill:'none',stroke:'#c8b0ff','stroke-width':1,opacity:.7});
  el('path',{d:`M${cx} ${cy-9}L${cx} ${cy+9}`,stroke:'#05060a','stroke-width':2.4});}                         // 满了中间一道竖瞳

// ---- 血条：两头箭头的双线细条（Lilies）----
const x0=104,x1=430,by=40,bh=6, fw=(x1-x0-8)*hp/100;
const bar=el('g',{filter:'url(#drop)'});
el('path',{d:`M${x0} ${by-4}H${x1} M${x0} ${by+bh+4}H${x1}`,stroke:'url(#silver)','stroke-width':1.2},bar);   // 上下发丝框
el('path',{d:`M${x0+6} ${by-8}L${x0-4} ${by+bh/2}L${x0+6} ${by+bh+8}`,fill:'none',stroke:'#e6e9ef','stroke-width':1.4},bar); // 左箭头
el('path',{d:`M${x0+12} ${by-8}L${x0+2} ${by+bh/2}L${x0+12} ${by+bh+8}`,fill:'none',stroke:'#8d96a8','stroke-width':1},bar);
el('path',{d:`M${x1-6} ${by-8}L${x1+4} ${by+bh/2}L${x1-6} ${by+bh+8}`,fill:'none',stroke:'#e6e9ef','stroke-width':1.4},bar); // 右箭头
el('path',{d:`M${x1-12} ${by-8}L${x1-2} ${by+bh/2}L${x1-12} ${by+bh+8}`,fill:'none',stroke:'#8d96a8','stroke-width':1},bar);
el('rect',{x:x0+4,y:by,width:x1-x0-8,height:bh,fill:'#0b0d13',opacity:.9},bar);
if(!low) el('rect',{x:x0+4+fw,y:by,width:Math.min(30,x1-x0-8-fw),height:bh,fill:'#7a3442',opacity:.75},bar);  // 刚掉的酒红残影
el('rect',{x:x0+4,y:by,width:fw,height:bh,fill:low?'url(#wine)':'url(#bone)'},bar);
el('rect',{x:x0+4,y:by,width:fw,height:1.2,fill:'#fff',opacity:.8},bar);
for(const f of [.25,.5,.75]){const x=x0+4+(x1-x0-8)*f; el('path',{d:`M${x} ${by-4}V${by-8}`,stroke:'#aab2c0','stroke-width':1},bar);} // 刻度
txt(String(hp),{x:x1+14,y:by+10,class:'num','font-size':20,fill:low?'#e58a96':'#e9e4d8',filter:'url(#drop)'});
txt('/ 100',{x:x1+14+(hp>=100?36:24),y:by+10,class:'num','font-size':12,fill:'#8f99ab',filter:'url(#drop)'});

// ---- 绝影：一排小菱形（暂停菜单的紫菱）----
txt('绝影',{x:x0+2,y:by+40,class:'song','font-size':13,'letter-spacing':4,fill:full?'#c8b0ff':'#aab2c0',filter:'url(#drop)'});
for(let i=0;i<5;i++){const px=x0+58+i*20, py=by+35, on=i<ult;
  if(on) dia(px,py,5.5,{fill:'url(#vio)',filter:'url(#glow)'}); else dia(px,py,5,{fill:'#07090e',stroke:'#6d778a','stroke-width':1});}
if(full) txt('J + K',{x:x0+168,y:by+40,class:'num','font-size':14,fill:'#e6e9ef',filter:'url(#glow)'});
// 波次
txt('第 1 轮 · 封印 Ⅰ / Ⅲ · 第 1 / 2 波',{x:x0+2,y:by+66,class:'song','font-size':11,'letter-spacing':3,fill:'#6d778a',filter:'url(#drop)'});

// ---- 右上：评价（鬼泣 5 的大字母 + 斜排评语，字用暂停菜单的银色哥特体）----
const R=el('g',{});
el('path',{d:'M1206 34 L1112 150',stroke:'#c8b0ff','stroke-width':1.2,opacity:.55,filter:'url(#glow)'},R);      // 字母后一道紫色细剑痕
txt('A',{x:1150,y:120,'text-anchor':'middle',class:'blk','font-size':112,fill:'url(#silver)',stroke:'#2a2f3b','stroke-width':1.2,filter:'url(#drop)'},R);
const tag=el('g',{transform:'translate(1150 150) skewX(-14)'},R);
txt('华丽',{x:0,y:0,'text-anchor':'middle',class:'song','font-size':26,'letter-spacing':10,fill:'#e9e4d8',filter:'url(#drop)'},tag);
el('rect',{x:1050,y:171.5,width:90,height:1,fill:'url(#fadeL)'},R); el('rect',{x:1160,y:171.5,width:90,height:1,fill:'url(#fadeR)'},R);
dia(1150,172,4.5,{fill:'none',stroke:'#c8b0ff','stroke-width':1.1},R); el('circle',{cx:1140,cy:172,r:1.4,fill:'#aab2c0'},R); el('circle',{cx:1160,cy:172,r:1.4,fill:'#aab2c0'},R);
txt('23',{x:1170,y:212,'text-anchor':'end',class:'num','font-size':38,fill:'#e9e4d8',filter:'url(#drop)'},R);
txt('连击',{x:1178,y:210,class:'song','font-size':15,'letter-spacing':4,fill:'#aab2c0',filter:'url(#drop)'},R);
el('rect',{x:1086,y:222,width:150,height:2,fill:'#2a2f3b'},R); el('rect',{x:1086,y:222,width:96,height:2,fill:'#c9cfda'},R); // 连击计时

// ---- 中上：弹出字 + 暂停菜单的分隔饰 ----
if(!low){txt('弹刀！',{x:640,y:96,'text-anchor':'middle',class:'song','font-size':30,'letter-spacing':14,fill:'#f1ece2',filter:'url(#drop)'});
el('rect',{x:530,y:113.5,width:94,height:1,fill:'url(#fadeL)'}); el('rect',{x:656,y:113.5,width:94,height:1,fill:'url(#fadeR)'});
dia(640,114,6,{fill:'none',stroke:'#c8b0ff','stroke-width':1.2}); el('circle',{cx:629,cy:114,r:1.5,fill:'#aab2c0'}); el('circle',{cx:651,cy:114,r:1.5,fill:'#aab2c0'});}

// ---- 敌人头顶：迷你版 Lilies Boss 条（两头小箭头）+ 伤害数字 ----
for(const [ex,ey,f] of [[733,438,.62],[790,466,.9],[882,470,.4]]){
  const w=48,x=ex-w/2;
  el('path',{d:`M${x} ${ey-3}H${x+w}M${x} ${ey+5}H${x+w}`,stroke:'#8d96a8','stroke-width':.8});
  el('path',{d:`M${x+3} ${ey-4}L${x-2} ${ey+1}L${x+3} ${ey+6}M${x+w-3} ${ey-4}L${x+w+2} ${ey+1}L${x+w-3} ${ey+6}`,fill:'none',stroke:'#aab2c0','stroke-width':.9});
  el('rect',{x:x+1,y:ey-1,width:w-2,height:4,fill:'#0b0d13',opacity:.9});
  el('rect',{x:x+1,y:ey-1,width:(w-2)*f,height:4,fill:'url(#wine)'});}
txt('128',{x:733,y:424,'text-anchor':'middle',class:'num','font-size':18,fill:'#f1ece2',filter:'url(#drop)'});
</script></body></html>
